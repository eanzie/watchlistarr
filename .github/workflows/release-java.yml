name: Test and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'sbt'
      # The ubuntu runner image no longer ships sbt, and setup-java stopped
      # bundling it, so it has to be installed explicitly.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: sbt validation
        run: sbt "scalafmtSbtCheck; scalafmtCheckAll; dependencyUpdatesFailBuild; unusedCompileDependenciesTest; undeclaredCompileDependenciesTest; test"
      - name: Build fat JAR
        run: sbt assembly
      - name: Rename fat JAR
        if: startsWith(github.ref, 'refs/tags/')
        run: cp ./target/scala-2.13/watchlistarr-assembly-0.1.0-SNAPSHOT.jar ./target/scala-2.13/watchlistarr.jar
      - name: Upload JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./target/scala-2.13/watchlistarr.jar

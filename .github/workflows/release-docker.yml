name: Docker Release CI

on:
  release:
    types: [published]

env:
  APP_NAME: watchlistarr
  DOCKER_FILE: docker/Dockerfile
  DOCKER_PLATFORMS: "linux/arm64/v8,linux/amd64"


jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is injected into every run, so publishing to ghcr.io needs no
    # manually created registry credentials - only this permission.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            latest

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKER_FILE }}
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
